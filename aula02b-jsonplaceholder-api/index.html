<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Usuários, Posts e Comentários — JSONPlaceholder</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container py-5">

    <h1 class="mb-4">
      Usuários (JSONPlaceholder)
    </h1>

    <!-- Campo de busca -->
    <div id="area-busca" class="mb-4">

      <input
        type="text"
        id="busca-usuario"
        class="form-control"
        placeholder="Buscar usuário pelo nome..."
      >

    </div>


    <!-- Spinner principal -->
    <div id="carregando" class="text-center py-4">

      <div
        class="spinner-border text-primary"
        role="status"
      >
        <span class="visually-hidden">
          Carregando...
        </span>
      </div>

    </div>


    <!-- TELA 1: USUÁRIOS -->
    <div
      id="tela-lista"
      class="row g-3"
    ></div>


    <!-- TELA 2: POSTS -->
    <div
      id="tela-detalhe"
      class="d-none"
    >

      <button
        id="btn-voltar"
        class="btn btn-outline-secondary mb-3"
      >
        ← Voltar para usuários
      </button>


      <h2
        id="detalhe-nome"
        class="h4 mb-2"
      ></h2>


      <p
        id="contador-posts"
        class="text-muted mb-3"
      ></p>


      <!-- Spinner dos posts -->
      <div
        id="carregando-posts"
        class="text-center py-4 d-none"
      >

        <div
          class="spinner-border text-primary"
          role="status"
        >
          <span class="visually-hidden">
            Carregando posts...
          </span>
        </div>

      </div>


      <div
        id="lista-posts"
        class="row g-3"
      ></div>

    </div>


    <!-- TELA 3: COMENTÁRIOS -->
    <div
      id="tela-comentarios"
      class="d-none"
    >

      <button
        id="btn-voltar-posts"
        class="btn btn-outline-secondary mb-3"
      >
        ← Voltar para posts
      </button>


      <h2 class="h4 mb-2">
        Comentários
      </h2>


      <h3
        id="titulo-post"
        class="h6 text-muted mb-3"
      ></h3>


      <p
        id="contador-comentarios"
        class="text-muted"
      ></p>


      <!-- Spinner dos comentários -->
      <div
        id="carregando-comentarios"
        class="text-center py-4 d-none"
      >

        <div
          class="spinner-border text-primary"
          role="status"
        >
          <span class="visually-hidden">
            Carregando comentários...
          </span>
        </div>

      </div>


      <div
        id="lista-comentarios"
        class="list-group"
      ></div>

    </div>

  </div>


  <script src="js/app.js"></script>

</body>

</html>
